# Builds the Synapse installers on real Windows and macOS machines and publishes them as a GitHub
# release. The website's download button points at the "latest" release, so pushing a new tag
# (or running this workflow by hand) is how a new version reaches people.
name: Release Synapse

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            artifact: desktop/release/SynapseSetup.exe
          - os: macos-latest
            dist: dist:mac
            artifact: |
              desktop/release/Synapse-mac-*.zip
              desktop/release/Synapse-mac-*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      # Spotlight grabs freshly mounted disk images and makes `hdiutil detach` fail ("resource busy").
      - name: Turn off Spotlight indexing (Mac build machine only)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true
      - run: npm run ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          SYNAPSE_RELAY_URL: ${{ vars.SYNAPSE_RELAY_URL || 'https://synapse-adaptive.vercel.app/api/relay' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    # Publish whatever built successfully — a failing Mac build shouldn't block the Windows installer.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Synapse ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            out/SynapseSetup.exe
            out/Synapse-mac-arm64.dmg
            out/Synapse-mac-x64.dmg
            out/Synapse-mac-arm64.zip
            out/Synapse-mac-x64.zip
